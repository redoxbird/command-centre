<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Commands - Command Center</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="vendor/enhanced-inputs.css" />
<link rel="stylesheet" href="vendor/inputs-remap.css" />
<link rel="stylesheet" href="vendor/xterm.css" />
</head>
<body data-page="commands">

<div class="app-window" x-data="ccCommands">
<nav class="tabs" aria-label="Primary"><a class="on" href="index.html" aria-current="page">My commands</a><a href="hub.html">Community Hub</a><a class="learn" href="learn.html">Learn</a></nav>
<div class="app-head">
<h1>Commands</h1><span class="count" id="count">7 saved</span>
<div class="view-switch" role="group" aria-label="View switcher"><button type="button" id="viewTool" class="on" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>Tool View</span></button><button type="button" id="viewCommand" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5 6 8l-3.5 3"/><path d="M7 11.5h6.5"/></svg><span>Command View</span></button><button type="button" id="viewControl" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><circle cx="6" cy="4.5" r="1.4" fill="var(--surface)"/><circle cx="10.5" cy="8" r="1.4" fill="var(--surface)"/><circle cx="5" cy="11.5" r="1.4" fill="var(--surface)"/></svg><span>Control View</span></button></div>
<div class="search"><input id="q" type="search" placeholder="Filter commands…" aria-label="Filter commands" /></div>
<label class="sort">Sort <select id="sort" aria-label="Sort commands"><option value="recent-added">Recently Added</option><option value="recent-used">Recently Used</option><option value="name">Name (A-Z)</option></select></label>
<a class="btn btn-run" href="add.html">+ Add command</a>
</div>
<div class="list" id="list"></div>
<div class="tool-layout" id="toolLayout" hidden><div class="tool-list" id="toolList" aria-label="Tools"></div><div class="tool-detail" id="toolDetail"></div></div>
<div class="add-wrap">
<div class="add-card">
<div class="cmd-icon">+</div>
<div class="od-fill"><strong>Add a reusable command</strong><p>Save a script, deploy step or git shortcut once, run it anytime with one click.</p></div>
<a class="btn btn-ghost" href="add.html">+ Add command</a>
</div>
</div>
<p class="foot">Commands run for real in your shell. Values you save stay on this machine.</p>
<footer class="statusbar" id="statusbar" aria-label="Application status"><span id="sbVersion"></span><span class="sp"></span><span id="sbPlatform"></span><span id="sbShells"></span></footer>
</div>
<script defer src="vendor/mustache.min.js"></script>
<script defer src="vendor/e-input.js"></script>
<script defer src="vendor/xterm.js"></script>
<script defer src="vendor/xterm-addon-fit.js"></script>
<script type="module">import "./vendor/range-slider.js";</script>
<script defer src="templates.js"></script>
<script defer src="grammar.js"></script>
<script defer src="app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</body>
</html>

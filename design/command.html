<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command — Command Center</title>
<style>
@layer od-layout {
:where(.od-stack,.od-row) > :where(*){min-width:0}
.od-stack{display:flex;flex-direction:column;gap:var(--od-gap,8px)}
.od-row{display:flex;align-items:center;gap:var(--od-gap,8px)}
.od-fill{flex:1 1 0;min-width:0}.od-fixed{flex:none}
}
:root{
--bg:#ffffff;--surface:#f6f8fa;--fg:#1f2328;--muted:#656d76;
--border:#d0d7de;--border-soft:#d8dee4;--accent:#0969da;--accent-hover:#0550ae;
--success:#1a7f37;--danger:#cf222e;--warn:#9a6700;
--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--radius:6px;--focus-ring:0 0 0 3px rgba(9,105,218,.3);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#e9edf1;color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;padding:0}
.app-window{width:100%;background:var(--bg);border:none;border-radius:0;overflow:hidden;box-shadow:none}
.tabs{display:flex;gap:4px;padding:12px 20px 0}
.tabs a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:var(--radius)}
.tabs a:hover{background:var(--surface);color:var(--fg)}
.tabs a:not(.on){border:1px solid transparent}
.tabs a.learn{margin-left:auto;font-weight:400}
.main{padding:8px 20px 22px;display:flex;flex-direction:column;gap:12px}
.backlink{font-size:13px;color:var(--accent);text-decoration:none;align-self:flex-start}
.backlink:hover{text-decoration:underline}
h1{font-size:24px;margin:2px 0 0;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0;max-width:70ch}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;border-radius:9999px;padding:0 8px;border:1px solid var(--border-soft)}
.badge-tag{background:#ddf4ff;color:var(--accent)}
.badge-pub{background:#dafbe1;color:var(--success);border-color:#a9d3ab}
.badge-npub{background:var(--surface);color:var(--muted)}
.badge-inputs{background:#fff8c5;color:var(--warn)}
.box{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
.box-h{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.box-h .count{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:9999px;padding:0 10px;color:var(--muted)}
.box-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.cmdline{font-family:var(--font-mono);font-size:12px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:var(--radius);padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.cmdline .dim{color:#8b949e}
.cmdline .pwd{color:#3fb950;font-weight:600}
.cmdline .ex{color:#79c0ff;background:rgba(56,139,253,.15);border:1px solid rgba(56,139,253,.4);border-radius:4px;padding:0 4px}
.rawline{font-family:var(--font-mono);font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.kv{display:grid;grid-template-columns:180px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--font-mono);font-size:12px}
.mrow{border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px 12px;display:grid;gap:8px;background:#fff}
.vmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px}
.vpill{font-family:var(--font-body);font-size:11px;font-weight:600;background:#ddf4ff;border:1px solid var(--border-soft);color:var(--accent);border-radius:9999px;padding:0 8px}
.ocpill{font-family:var(--font-body);font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:9999px;padding:0 8px}
.apill{font-family:var(--font-body);font-size:11px;font-weight:600;background:#fff8c5;border:1px solid #d4a72c;color:var(--warn);border-radius:9999px;padding:0 8px}
.vex{color:var(--success);background:#dafbe1;border:1px solid #a9d3ab;border-radius:4px;padding:0 6px;font-weight:600}
.mlabel{font-size:13px}
.mlabel strong{display:block;font-size:13px}
.mlabel span{display:block;color:var(--muted);font-size:12px}
.optable{width:100%;border-collapse:collapse;font-size:12px}
.optable th{text-align:left;color:var(--muted);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border)}
.optable td{padding:4px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.optable tr:last-child td{border-bottom:none}
.optable td.mono{font-family:var(--font-mono)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:inherit;font-size:14px;border-radius:var(--radius);padding:6px 18px;cursor:pointer;border:1px solid transparent;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-p{background:#1f883d;color:#fff;border-color:rgba(31,35,40,.15);font-weight:500}
.btn-p:hover{background:var(--success)}
.btn-g{background:var(--surface);color:var(--fg);border-color:var(--border)}
.btn-g:hover{background:#f3f4f6}
.btn:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--success)}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted);background:#fff}
.empty a{color:var(--accent)}
[hidden]{display:none!important}
@media(max-width:640px){.kv{grid-template-columns:1fr}.actions .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="actions">

<button class="btn btn-g" id="dlBtn" type="button">Metadata .json ↓</button>
<span class="status" id="pubStatus" role="status"></span>
</div>
</div>
</div>
</div>

function loadCustoms(){try{var c=JSON.parse(localStorage.getItem("cc-commands")||"[]");if(Array.isArray(c))return c;}catch(e){}return [];}
function findCommand(id){
var customs=loadCustoms();
for(var i=0;i<customs.length;i++){if(String(customs[i].id)===String(id))return customs[i];}
for(var j=0;j<DEFAULTS.length;j++){if(String(DEFAULTS[j].id)===String(id))return DEFAULTS[j];}
return null;
}
function getPub(){try{return JSON.parse(localStorage.getItem("cc-published")||"{}");}catch(e){return {};}}
function setPub(o){try{localStorage.setItem("cc-published",JSON.stringify(o));}catch(e){}}
function el(tag,cls,text){var d=document.createElement(tag);if(cls)d.className=cls;if(text!=null)d.textContent=text;return d;}
function badge(text,cls){return el("span","badge "+cls,text);}
function fieldRow(term,val,mono){
var dt=el("dt",null,term);var dd=el("dd",mono?"mono":null,val===""?"—":val);return [dt,dd];
}
function matchSaved(saved,inst,used){
if(!saved||!saved.length)return null;
for(var i=0;i<saved.length;i++){
if(used[i])continue;
if(saved[i].iid&&saved[i].iid===inst.iid){used[i]=true;return saved[i];}
}
for(var j=0;j<saved.length;j++){
if(used[j])continue;
if(!saved[j].iid&&saved[j].key===inst.key){used[j]=true;return saved[j];}
}
return null;
}
function paintDetail(c){
document.title=c.name+" — Command Center";
document.getElementById("dname").textContent=c.name;
document.getElementById("ddesc").textContent=c.desc||"";
var badges=document.getElementById("dbadges");badges.innerHTML="";
badges.appendChild(badge(c.tag||"command","badge-tag"));
badges.appendChild(badge(c.custom?"local":"built-in","badge-npub"));
if(c.showcase)badges.appendChild(badge("demo showcase","badge-inputs"));
var pub=getPub();
var isPub=!!pub[c.id];
var pubB=isPub?badge("published ✓","badge-pub"):badge("not published","badge-npub");
pubB.id="pubBadge";badges.appendChild(pubB);
document.getElementById("draw").textContent=c.cmd||"";
var prev=document.getElementById("dprev");prev.innerHTML="";
var dir=c.cwd||"C:\\projects\\app";
prev.appendChild(el("span","dim","PS "));
prev.appendChild(el("span","pwd",dir));
prev.appendChild(el("span","dim","> "));
var insts=parseVarInstances(c.cmd||"");
var used={};
var metas=insts.map(function(v){return matchSaved(c.vars,v,used);});
var counts={};
var re=/\{\{\s*([^{}]*?)\s*\}\}/g,last=0,m;
var src=String(c.cmd||"");
while((m=re.exec(src))){
if(m.index>last)prev.appendChild(document.createTextNode(src.slice(last,m.index)));
var p=parseToken(m[1]);
if(p){
var occ=(counts[p.key]||0)+1;counts[p.key]=occ;
var idx=insts.length?indexOfInst(insts,p.key,occ):-1;
var label=p.token,ex=exampleFor(p,null);
if(idx>=0){label=metaLabel(insts[idx],metas[idx]);ex=exampleFor(insts[idx],metas[idx]);}
var chip=el("span","ex",label);chip.title=p.token+" = "+ex;
prev.appendChild(chip);
}else{prev.appendChild(document.createTextNode(m[0]));}
last=m.index+m[0].length;
}
if(last<src.length)prev.appendChild(document.createTextNode(src.slice(last)));
var fields=document.getElementById("dfields");fields.innerHTML="";
fieldRow("Working directory",dir,true).forEach(function(n){fields.appendChild(n);});
fieldRow("Ask for values",c.askMode==="once"?"Once, then remember":(c.askMode==="every"?"Every time":"—"),false).forEach(function(n){fields.appendChild(n);});
fieldRow("Command ID",String(c.id),true).forEach(function(n){fields.appendChild(n);});
fieldRow("Source",c.showcase?"Showcase demo (built-in)":(c.fromHub?("Community Hub ("+c.fromHub+")"):(c.custom?"My commands (local)":"Built-in")),false).forEach(function(n){fields.appendChild(n);});
fieldRow("Published",isPub?"Yes":"No",false).forEach(function(n){fields.appendChild(n);});
var mrows=document.getElementById("mrows");mrows.innerHTML="";
document.getElementById("mcount").textContent=insts.length?(insts.length+(insts.length===1?" input":" inputs")):"no inputs";
if(!insts.length){
var none=el("p",null,"This command has no {{input.*}} variables — it runs as written.");
none.style.color="var(--muted)";mrows.appendChild(none);
}
insts.forEach(function(v,i){
var sv=metas[i];
mrows.appendChild(metaRow(v,sv));
});
var editBtn=document.getElementById("editBtn");
editBtn.href=c.showcase?"add.html":"add.html?id="+encodeURIComponent(c.id);
var pubLink=document.getElementById("pubBtn");
if(pubLink)pubLink.href="publish.html?id="+encodeURIComponent(c.id);
var dlBtn=document.getElementById("dlBtn");
if(dlBtn)dlBtn.onclick=function(){downloadMetadata(c);};
syncPublish(c);
}
function indexOfInst(insts,key,occ){
for(var i=0;i<insts.length;i++){if(insts[i].key===key&&insts[i].occ===occ)return i;}
return -1;
}
function metaLabel(v,sv){
if(sv&&sv.label&&trim(sv.label)!=="")return trim(sv.label);
var lbl=humanize(v.name);
if(v.total>1)lbl+=" "+v.occ;
if(v.auto)lbl+=" (auto)";
return lbl;
}
function metaRow(v,sv){
var row=el("div","mrow");
var top=el("div","vmeta");
top.appendChild(el("span",null,v.token));
top.appendChild(el("span","vpill",v.type));
if(v.total>1)top.appendChild(el("span","ocpill",v.occ+" of "+v.total));
if(v.auto)top.appendChild(el("span","apill","auto"));
var ex=exampleFor(v,sv);
top.appendChild(el("span","vex","→ "+(ex===""?"(empty)":ex)));
row.appendChild(top);
var lab=el("div","mlabel");
lab.appendChild(el("strong",null,metaLabel(v,sv)));
var d=(sv&&sv.description&&trim(sv.description)!=="")?trim(sv.description):"";
lab.appendChild(el("span",null,d===""?"No description yet.":d));
row.appendChild(lab);
if(v.type==="select"||v.type==="radio"){
var opts=(sv&&sv.options&&sv.options.length)?sv.options:((v.optionsArr||[]).map(function(o){return {value:o,label:o,description:""};}));
if(opts.length){
var t=document.createElement("table");t.className="optable";
var tr=document.createElement("tr");
["Option","Label","Description"].forEach(function(h){var th=document.createElement("th");th.textContent=h;tr.appendChild(th);});
t.appendChild(tr);
opts.forEach(function(o){
var r=document.createElement("tr");
var c1=document.createElement("td");c1.className="mono";c1.textContent=o.value;
var c2=document.createElement("td");c2.textContent=o.label||o.value;
var c3=document.createElement("td");c3.textContent=o.description||"—";
r.appendChild(c1);r.appendChild(c2);r.appendChild(c3);t.appendChild(r);
});
row.appendChild(t);
}
}
return row;
}
function metadataDoc(c){
var insts=parseVarInstances(c.cmd||"");
var used={};
var rows=insts.map(function(v){
var sv=matchSaved(c.vars,v,used);
var lbl=metaLabel(v,sv);
var des=(sv&&sv.description&&trim(sv.description)!=="")?trim(sv.description):"";
var o={token:v.token,type:v.type,label:lbl,description:des,default:(v.default!==""?v.default:""),auto:!!v.auto};
if(v.total>1){o.occurrence=v.occ;o.of=v.total;}
if(v.type==="select"||v.type==="radio"){
var opts=(sv&&sv.options&&sv.options.length)?sv.options:((v.optionsArr||[]).map(function(x){return {value:x,label:x,description:""};}));
o.options=opts.map(function(x){return {value:x.value,label:x.label||x.value,description:x.description||""};});
}
if(sv&&sv.example!==undefined&&sv.example!=="")o.example=String(sv.example);
else{var ex=exampleFor(v,sv);if(ex!=="")o.example=ex;}
return o;
});
return {app:"command-center",kind:"command-metadata",version:1,exportedAt:new Date().toISOString(),id:String(c.id),name:c.name||"",description:c.desc||"",command:c.cmd||"",workingDirectory:c.cwd||"",tag:c.tag||"",askMode:c.askMode||"every",variables:rows};
}
function downloadMetadata(c){
try{
var doc=metadataDoc(c);
var blob=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"});
var a=document.createElement("a");
var fname="command-"+String(c.id).replace(/[^a-zA-Z0-9_-]+/g,"-")+".metadata.json";
a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}try{a.remove();}catch(e2){}},400);
var st=document.getElementById("pubStatus");
if(st){st.textContent="Metadata saved as "+fname+" — load it on the publish page.";st.className="status ok";}
}catch(err){
var st2=document.getElementById("pubStatus");
if(st2){st2.textContent="Could not export metadata in this browser.";st2.className="status";}
}
}
function syncPublish(c){
var pub=getPub(),isPub=!!pub[c.id];
var st=document.getElementById("pubStatus");
st.textContent=isPub?"Published — visible as published in this browser.":"Not published yet. Publishing opens the review form.";
st.className="status"+(isPub?" ok":"");
var badge=document.getElementById("pubBadge");
if(badge){badge.textContent=isPub?"published ✓":"not published";badge.className="badge "+(isPub?"badge-pub":"badge-npub");}
var rows=document.getElementById("dfields");
if(rows&&rows.children.length>=10){rows.children[9].textContent=isPub?"Yes":"No";}
}
(function init(){
var id=null;
try{id=new URLSearchParams(location.search).get("id");}catch(e){id=null;}
var box=document.getElementById("detail"),miss=document.getElementById("missing");
var c=id?findCommand(id):null;
if(!c){c=SHOWCASE;}
box.hidden=false;
miss.hidden=true;
paintDetail(c);
})();
</script>
</body>
